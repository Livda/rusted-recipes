[package]
name = "rusted-recipes"
version = "1.0.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-key-expansion", "cookie-signed", "form"] }
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
cookie = "0.18.2"
dotenvy = "0.15.7"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "macros", "migrate", "tls-rustls"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum-extra = "0.12.6"
http-body-util = "0.1.5"
serde_urlencoded = "0.7.1"
tower = "0.5.3"

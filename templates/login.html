{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<h1>Merci de vous connecter</h1>
{% if let Some(error) = error %}
  <p class="flash" data-type="danger" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="{{ ctx.login_url() }}">
  <input type="hidden" name="_csrf_token" value="{{ ctx.csrf }}">
  <label for="username">Nom d'utilisateur</label>
  <input type="text" id="username" name="_username" value="{{ last_username }}" autocomplete="username" required autofocus>
  <label for="password">Mot de passe</label>
  <input type="password" id="password" name="_password" autocomplete="current-password" required>
  <label class="checkbox"><input type="checkbox" name="_remember_me"> Se souvenir de moi</label>
  <button type="submit">Connexion</button>
</form>
{% endblock %}

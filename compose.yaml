services:
  database:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-symfony}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-symfony}
      MARIADB_USER: ${MARIADB_USER:-symfony}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-symfony}
    volumes:
      - database:/var/lib/mysql
    ports:
      - "3006:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://symfony:symfony@database:3306/symfony
      APP_SECRET: ${APP_SECRET:-change-me-with-at-least-32-random-characters}
    ports:
      - "8000:8000"

volumes:
  database:
